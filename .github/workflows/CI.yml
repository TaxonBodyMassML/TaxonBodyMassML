#basic actions workflow to check for syntax errors and make sure it passes tests (tests not implemented yet)

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetches the entire history

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black==26.5.1 flake8 pytest

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
      - name:
          Super-Linter
          # You may pin to the exact commit or the version.
          # uses: super-linter/super-linter@b92721f792f381cedc002ecdbb9847a15ece5bb8
        continue-on-error: true
        uses: super-linter/super-linter@v7.1.0
        env:
          # To report GitHub Actions status checks
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #FILTER_REGEX_INCLUDE: ^src/
          VALIDATE_ALL_CODEBASE: false
          FIX_JAVASCRIPT_PRETTIER: true
          FIX_HTML_PRETTIER: true
          VALIDATE_JSCPD: false
          VALIDATE_JAVASCRIPT_STANDARD: false

      - name: Check formatting
        run: black --check .

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            pytest -q
          else
            echo "No tests implemented yet."
          fi

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clone Pages repo
        run: |
          git clone https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/taxonbodymassml/taxonbodymassml.github.io.git pages_repo

      - name: Sync web_dev to Pages repo
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='Procfile' \
            --exclude='requirements.txt' \
            --exclude='prototype_lookup.py' \
            --exclude='routes/' \
            --exclude='more_questions.db' \
            --exclude='more_questions_db.py' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='__pycache__/' \
            --exclude='.stylelintrc.json' \
            web_dev/ pages_repo/

      - name: Commit and push if changed
        run: |
          cd pages_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: sync web_dev from TaxonBodyMassML@${{ github.sha }}"
            git push
          fi
