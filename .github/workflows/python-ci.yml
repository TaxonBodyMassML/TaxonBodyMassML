name: Python package CI

on:
  push:
    branches: [main, packages]
    paths:
      - "packages/python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/python/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[progress,dev]"

      - name: black (format check)
        run: black --check .

      - name: flake8 (style check)
        run: flake8 taxonbodymassml tests --max-line-length=100

      - name: pytest (unit tests only; no artifact download)
        run: pytest -v
        env:
          TAXONBODYMASSML_RUN_INTEGRATION: "0"
