name: Python package CI

on:
  push:
    branches: [main, packages]
    paths:
      - "packages/python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/python/**"

permissions: read-all

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[progress,dev]"

      - name: black (format check)
        run: black --check .

      - name: flake8 (style check)
        run: flake8 taxonbodymassml tests --max-line-length=100

      - name: pytest (unit tests only; no artifact download)
        run: pytest -v
        env:
          TAXONBODYMASSML_RUN_INTEGRATION: "0"

      - name: Validate categories.json checksum
        run: |
          python - <<'EOF'
          import hashlib, urllib.request
          url = "https://huggingface.co/marknovak/TaxonBodyMassML/resolve/main/categories.json"
          expected = "e5279d3ce01b22c8fc0079081707bcd31e8bfc857b14fa3e61ff071e12290ea8"
          with urllib.request.urlopen(url) as r:
              data = r.read()
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected, f"SHA256 mismatch: {actual}"
          print("categories.json checksum OK")
          EOF

  release:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Get version
        id: version
        run: |
          v=$(python -c "import tomllib; f=open('packages/python/pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build packages/python/
          cp packages/python/dist/taxonbodymassml-${{ steps.version.outputs.version }}-py3-none-any.whl \
             packages/python/dist/taxonbodymassml-latest-py3-none-any.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: python-v${{ steps.version.outputs.version }}
          name: "Python package v${{ steps.version.outputs.version }}"
          files: |
            packages/python/dist/taxonbodymassml-*.whl
            packages/python/dist/taxonbodymassml-*.tar.gz
