name: R package CI

on:
  push:
    branches: [main, packages]
    paths:
      - "packages/r/**"
      - ".github/workflows/r-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/r/**"

permissions: read-all

jobs:
  r-cmd-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
          extra-packages: |
            any::rcmdcheck
            any::openssl

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Add TinyTeX to PATH
        run: echo "$(Rscript -e 'cat(Sys.glob(file.path(tinytex::tinytex_root(), "bin", "*")))')" >> $GITHUB_PATH

      - name: R CMD check
        run: rcmdcheck::rcmdcheck("packages/r", args = "--as-cran", error_on = "warning")
        shell: Rscript {0}

      - name: Validate categories.json checksum
        shell: Rscript {0}
        run: |
          url <- "https://huggingface.co/marknovak/TaxonBodyMassML/resolve/main/categories.json"
          expected <- "b130cc3fd567b374426be7a842eae6234d1bdb2a53371fd7291310e974abdd62"
          tmp <- tempfile(fileext = ".json")
          utils::download.file(url, tmp, quiet = TRUE, mode = "wb")
          actual <- as.character(openssl::sha256(file(tmp, "rb")))
          if (!(actual == expected)) stop("SHA256 mismatch: got ", actual)
          cat("categories.json checksum OK\n")

  release:
    needs: r-cmd-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Get version
        id: version
        run: |
          v=$(grep "^Version:" packages/r/DESCRIPTION | sed 's/Version: *//')
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "tarball=TaxonBodyMassML_${v}.tar.gz" >> $GITHUB_OUTPUT

      - name: Build source tarball
        run: |
          R CMD build --no-build-vignettes packages/r
          cp ${{ steps.version.outputs.tarball }} TaxonBodyMassML_latest.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: r-v${{ steps.version.outputs.version }}
          name: "R package v${{ steps.version.outputs.version }}"
          files: |
            ${{ steps.version.outputs.tarball }}
            TaxonBodyMassML_latest.tar.gz
